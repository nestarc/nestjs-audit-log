name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  mssql-release-gate:
    name: SQL Server release gate
    uses: ./.github/workflows/mssql-preflight.yml

  release:
    needs: [mssql-release-gate]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: audit_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/audit_test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify patched Node runtime and Brotli decoding
        timeout-minutes: 1
        run: node scripts/verify-node-security.cjs

      - name: Verify release ref
        run: |
          node -e "const version = require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v' + version) { console.error('tag/package version mismatch'); process.exit(1); }"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:cov -- --runInBand

      - name: Push test schema
        run: npx prisma db push

      - name: E2E tests
        run: npm run test:e2e

      - name: Verify packed adoption scenarios
        run: npm run test:docs:consumer

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
