name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.19', '22.12', '24']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: audit_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/audit_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Push test schema
        run: npx prisma db push

      - name: E2E tests
        run: npm run test:e2e

  peer-matrix:
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - { nest: 10, prisma: 5, express: 4, client: legacy }
          - { nest: 10, prisma: 6, express: 4, client: legacy }
          - { nest: 10, prisma: 7, express: 4, client: generated }
          - { nest: 11, prisma: 5, express: 5, client: legacy }
          - { nest: 11, prisma: 6, express: 5, client: legacy }
          - { nest: 11, prisma: 7, express: 5, client: generated }

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: audit_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/audit_test
      PRISMA_TEST_CLIENT: ${{ matrix.client }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install peer combination
        run: |
          npm install --no-save \
            @nestjs/common@^${{ matrix.nest }} \
            @nestjs/core@^${{ matrix.nest }} \
            @nestjs/platform-express@^${{ matrix.nest }} \
            @nestjs/testing@^${{ matrix.nest }} \
            express@^${{ matrix.express }} \
            @types/express@^${{ matrix.express }} \
            @prisma/client@^${{ matrix.prisma }} \
            prisma@^${{ matrix.prisma }}

      - name: Generate Prisma 7 client
        if: matrix.client == 'generated'
        run: npx prisma generate

      - name: Generate legacy Prisma client
        if: matrix.client == 'legacy'
        run: npx prisma generate --schema=test/e2e/prisma/schema.legacy.prisma

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Push Prisma 7 test schema
        if: matrix.client == 'generated'
        run: npx prisma db push

      - name: Push legacy Prisma test schema
        if: matrix.client == 'legacy'
        run: npx prisma db push --schema=test/e2e/prisma/schema.legacy.prisma --skip-generate

      - name: E2E tests
        run: npm run test:e2e
