services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audit_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - '5433:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 1s
    tmpfs:
      - /var/lib/postgresql/data
